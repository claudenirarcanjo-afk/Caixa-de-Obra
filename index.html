<title>Caixa de Obra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F1F1EF;--card:#fff;--ink:#1A1A1C;--muted:#66666D;--line:#DCDCD8;--red:#C00000;--redsoft:#F8E4E4;--ok:#1D7A47;--oksoft:#DCF0E3;--blue:#1F4E79;--bluesoft:#DDEAF6}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1D1D20;--ink:#EDEDEF;--muted:#9E9EA6;--line:#2F2F34;--red:#FF5C50;--redsoft:#3A1D1B;--ok:#66C78E;--oksoft:#1B3325;--blue:#9CC6EE;--bluesoft:#1E2F40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{background:#fff;border-radius:6px;padding:6px 10px}.logo img{display:block;height:26px}
.who{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:13px 14px;font-weight:600;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px}.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.photo{border:2px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;text-align:center}
.photo img{max-width:100%;max-height:240px;border-radius:8px;margin:0 auto}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--bluesoft);color:var(--blue)}
.item{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.item .meta{color:var(--muted);font-size:14px}
.item .acts{display:flex;gap:8px}.item .acts button{padding:8px 12px;font-size:14px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}.msg.err{background:var(--redsoft);color:var(--red)}.msg.ok{background:var(--oksoft);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;z-index:5}.modal img{max-width:100%;max-height:80vh;border-radius:8px}.modal button{margin-top:10px}
#cropWrap{position:relative;overflow:hidden;touch-action:none;border-radius:8px;line-height:0}
#cropImg{display:block;width:100%;height:auto;max-height:none}
#cropBox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}
.hd{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;background:#fff;border:3px solid var(--red);border-radius:50%;touch-action:none}
.hd[data-h=nw]{left:0;top:0}.hd[data-h=n]{left:50%;top:0}.hd[data-h=ne]{left:100%;top:0}.hd[data-h=e]{left:100%;top:50%}
.hd[data-h=se]{left:100%;top:100%}.hd[data-h=s]{left:50%;top:100%}.hd[data-h=sw]{left:0;top:100%}.hd[data-h=w]{left:0;top:50%}.stack{display:grid;gap:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps div{border-top:4px solid var(--line);padding-top:6px;font-size:12px;color:var(--muted)}
.steps div.on{border-top-color:var(--red);color:var(--ink);font-weight:600}
.ant{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ant:last-child{border-bottom:0}
.ant .t{display:grid;gap:2px}.ant .t small{color:var(--muted)}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.red{background:var(--redsoft);color:var(--red)}
[hidden]{display:none!important}
</style>
</head>

<script>

async function entrar(code) {

    DADOS = await run('appInit', code);
    CODE = code; PAPEL = DADOS.papel;

  } catch (e) {
    try { localStorage.removeItem('cx_code'); } catch (x) {}
    show($('app'), false); show($('login'), true);
    flash($('loginErr'), e.message.indexOf('Codigo') >= 0 ? 'Código inválido.' : 'Não consegui entrar: ' + e.message, 'err');
  }
}
function montar() {
  show($('login'), false); show($('app'), true);
  $('who').textContent = 'Entrou como ' + (PAPEL === 'claudenir' ? 'Claudenir' : 'Conferente');
  show($('logout'), true);
  var tabs = $('tabs'); tabs.innerHTML = '';
  var lista = PAPEL === 'claudenir' ? [['novo', 'Novo'], ['semana', 'Semana']] : [['semana', 'Semana']];
  lista.forEach(function (t) { var b = document.createElement('button'); b.textContent = t[1]; b.dataset.t = t[0]; b.onclick = function () { aba(t[0]); }; tabs.appendChild(b); });
  var c = $('centro'); c.innerHTML = '';
  DADOS.centros.forEach(function (x) { var o = document.createElement('option'); o.value = x[0]; o.textContent = x[0] + ' · ' + x[1]; c.appendChild(o); });
  try { var u = localStorage.getItem('cx_centro'); if (u) c.value = u; } catch (e) {}
  var k = $('cat'); k.innerHTML = '';
  DADOS.categorias.forEach(function (x) { var o = document.createElement('option'); o.value = x; o.textContent = x; k.appendChild(o); });
  $('data').value = hoje();
  aba(PAPEL === 'claudenir' ? 'novo' : 'semana');
}
function aba(nome) {
  show($('novo'), nome === 'novo' && PAPEL === 'claudenir'); show($('semana'), nome === 'semana'); show($('fin'), nome === 'novo' && FIN_OK);
  if (nome === 'novo') atualizarFin();
  Array.prototype.forEach.call($('tabs').children, function (b) { b.setAttribute('aria-pressed', b.dataset.t === nome); });
  if (nome === 'semana') listar();
}

function lerArquivo(f) {
  return new Promise(function (ok, fail) {
    var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { fail(new Error('Não consegui ler o arquivo')); }; r.readAsDataURL(f);
  });
}
var FIN_OK = false, PREVIA = null, SRC = null, RC = null, ROT = 0, CROP = { x0: 0, y0: 0, x1: 1, y1: 1 }, EDIT = false, DRAG = null, LEITURA = null, SEQ = 0, TMR = null;
function carregarImg(dataUrl) {
  return new Promise(function (ok, fail) {
    var im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { fail(new Error('Imagem inválida')); }; im.src = dataUrl;
  });
}
// gira e reduz a foto (maior lado 2000 px)
function desenhar(im, rot) {
  var s = Math.min(1, 2000 / Math.max(im.width, im.height)), w = Math.round(im.width * s), h = Math.round(im.height * s);
  var c = document.createElement('canvas'); c.width = rot % 2 ? h : w; c.height = rot % 2 ? w : h;
  var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 2); x.drawImage(im, -w / 2, -h / 2, w, h);
  return c;
}
// acha o papel (Otsu numa versão pequena) e devolve a caixa em frações 0..1
function acharPapel(c) {
  var s = 200 / Math.max(c.width, c.height), w = Math.max(20, Math.round(c.width * s)), h = Math.max(20, Math.round(c.height * s));
  var t = document.createElement('canvas'); t.width = w; t.height = h; var tx = t.getContext('2d'); tx.drawImage(c, 0, 0, w, h);
  var d = tx.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h), hist = new Array(256).fill(0), i;
  for (i = 0; i < w * h; i++) { g[i] = (d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000; hist[g[i]]++; }
  var total = w * h, sum = 0, sB = 0, wB = 0, best = 0, th = 128;
  for (i = 0; i < 256; i++) sum += i * hist[i];
  for (i = 0; i < 256; i++) { wB += hist[i]; if (!wB) continue; var wF = total - wB; if (!wF) break; sB += i * hist[i]; var mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF); if (v > best) { best = v; th = i; } }
  var rows = new Array(h).fill(0), cols = new Array(w).fill(0), y, x2;
  for (y = 0; y < h; y++) for (x2 = 0; x2 < w; x2++) if (g[y * w + x2] > th) { rows[y]++; cols[x2]++; }
  var rmin = Math.max(2, Math.round(w * 0.12)), cmin = Math.max(2, Math.round(h * 0.12)), y0 = 0, y1 = h - 1, x0 = 0, x1 = w - 1;
  while (y0 < h && rows[y0] < rmin) y0++; while (y1 > y0 && rows[y1] < rmin) y1--;
  while (x0 < w && cols[x0] < cmin) x0++; while (x1 > x0 && cols[x1] < cmin) x1--;
  var area = (x1 - x0 + 1) * (y1 - y0 + 1) / total;
  if (area < 0.2 || area > 0.97) return { x0: 0, y0: 0, x1: 1, y1: 1 };
  var mx = (x1 - x0) * 0.01 / w, my = (y1 - y0) * 0.01 / h;
  return { x0: Math.max(0, x0 / w - mx), y0: Math.max(0, y0 / h - my), x1: Math.min(1, (x1 + 1) / w + mx), y1: Math.min(1, (y1 + 1) / h + my) };
}
function cortar(c, r) {
  var X0 = Math.round(r.x0 * c.width), Y0 = Math.round(r.y0 * c.height), W = Math.max(10, Math.round((r.x1 - r.x0) * c.width)), H = Math.max(10, Math.round((r.y1 - r.y0) * c.height));
  var o = document.createElement('canvas'); o.width = W; o.height = H; o.getContext('2d').drawImage(c, X0, Y0, W, H, 0, 0, W, H); return o;
}
// efeito de scanner: divide pela iluminação estimada. 'suave' mantém tons de cinza; 'forte' é preto e branco duro
function melhorar(c, modo) {
  if (modo === 'cor') return c;
  var w = c.width, h = c.height, ctx = c.getContext('2d'), img = ctx.getImageData(0, 0, w, h), d = img.data, i;
  var gc = document.createElement('canvas'); gc.width = w; gc.height = h; var gx = gc.getContext('2d'), gi = gx.createImageData(w, h), G = new Uint8ClampedArray(w * h);
  for (i = 0; i < w * h; i++) { var v = (d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000; G[i] = v; gi.data[i * 4] = gi.data[i * 4 + 1] = gi.data[i * 4 + 2] = v; gi.data[i * 4 + 3] = 255; }
  gx.putImageData(gi, 0, 0);
  var sw = Math.max(8, Math.round(w / 40)), sh = Math.max(8, Math.round(h / 40)), sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  var sx = sc.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(gc, 0, 0, sw, sh);
  var bc = document.createElement('canvas'); bc.width = w; bc.height = h; var bx = bc.getContext('2d'); bx.imageSmoothingQuality = 'high'; bx.drawImage(sc, 0, 0, w, h);
  var B = bx.getImageData(0, 0, w, h).data;
  var branco = modo === 'forte' ? 0.92 : 0.9, expo = modo === 'forte' ? 3.2 : 1.7, piso = modo === 'forte' ? 0 : 26;
  for (i = 0; i < w * h; i++) {
    var bg = B[i * 4], out;
    if (bg < 55) out = 255; // area escura fora do papel
    else { var r = G[i] / Math.max(30, bg * 1.04); out = r >= branco ? 255 : piso + (255 - piso) * Math.pow(r / branco, expo); }
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = out; d[i * 4 + 3] = 255;
  }

}
function gerarPdf(c) {
  var J = window.jspdf && window.jspdf.jsPDF; if (!J) return null;
  var wpt = Math.round(c.width * 0.36), hpt = Math.round(c.height * 0.36);
  var pdf = new J({ unit: 'pt', format: [wpt, hpt], orientation: wpt > hpt ? 'landscape' : 'portrait', compress: true });
  pdf.addImage(c.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, wpt, hpt);
  return pdf.output('datauristring').split(',')[1];
}
// ---- telas: resultado x ajuste de recorte
function boxAtualiza() {
  var b = $('cropBox'); b.style.left = (CROP.x0 * 100) + '%'; b.style.top = (CROP.y0 * 100) + '%';
  b.style.width = ((CROP.x1 - CROP.x0) * 100) + '%'; b.style.height = ((CROP.y1 - CROP.y0) * 100) + '%';
}
function mostrarAjuste() {
  EDIT = true; $('btnCrop').textContent = 'Concluir recorte';
  var m = Math.min(1, 900 / Math.max(RC.width, RC.height)), p = document.createElement('canvas'); p.width = Math.round(RC.width * m); p.height = Math.round(RC.height * m);
  p.getContext('2d').drawImage(RC, 0, 0, p.width, p.height);
  $('cropImg').src = p.toDataURL('image/jpeg', 0.75); show($('cropWrap'), true); show($('prev'), false); boxAtualiza();
}
function mostrarResultado(ler) {
  EDIT = false; $('btnCrop').textContent = 'Ajustar recorte'; show($('cropWrap'), false);
  var c = cortar(RC, CROP); c = melhorar(c, $('scanMode').value);
  var pm = Math.min(1, 1400 / Math.max(c.width, c.height)), pc = document.createElement('canvas'); pc.width = Math.round(c.width * pm); pc.height = Math.round(c.height * pm);
  pc.getContext('2d').drawImage(c, 0, 0, pc.width, pc.height); PREVIA = pc.toDataURL('image/jpeg', 0.72).split(',')[1];
  $('prev').src = c.toDataURL('image/jpeg', 0.7); show($('prev'), true);
  var b64 = null; try { b64 = gerarPdf(c); } catch (e) { b64 = null; }
  var base = (SRC.__nome || 'nota').replace(/\.[^.]+$/, '');
  FOTO = b64 ? { nome: base + '.pdf', mime: 'application/pdf', base64: b64 } : { nome: base + '.jpg', mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
  $('photoName').textContent = FOTO.nome + ' (' + Math.round(FOTO.base64.length * 0.75 / 1024) + ' KB)' + (b64 ? ' · PDF' : '');
  if (ler) { clearTimeout(TMR); TMR = setTimeout(lerComIA, 300); }
}
function girar() { if (!SRC) return; ROT = (ROT + 1) % 4; RC = desenhar(SRC, ROT); CROP = acharPapel(RC); if (EDIT) mostrarAjuste(); else mostrarResultado(); }
function iniciarArraste(e) {
  var h = e.target.getAttribute && e.target.getAttribute('data-h'); if (!h) return;
  DRAG = h; try { e.target.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault();
}
function moverArraste(e) {
  if (!DRAG) return;
  var r = $('cropWrap').getBoundingClientRect(), fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)), g = 0.06;
  if (DRAG.indexOf('w') >= 0) CROP.x0 = Math.min(fx, CROP.x1 - g);
  if (DRAG.indexOf('e') >= 0) CROP.x1 = Math.max(fx, CROP.x0 + g);
  if (DRAG.indexOf('n') >= 0) CROP.y0 = Math.min(fy, CROP.y1 - g);
  if (DRAG.indexOf('s') >= 0) CROP.y1 = Math.max(fy, CROP.y0 + g);
  boxAtualiza(); e.preventDefault();
}
function fimArraste() { DRAG = null; }

async function escolheu(f) {
  if (!f) return;
  LEITURA = null; show($('aiMsg'), false); EDIT = false;
  try {
    var d = await lerArquivo(f);
    if (f.type === 'application/pdf') {
      SRC = null; RC = null; PREVIA = null; show($('scanCtl'), false); show($('modeLbl'), false); show($('prev'), false); show($('cropWrap'), false);
      FOTO = { nome: f.name, mime: 'application/pdf', base64: d.split(',')[1] };
      $('photoName').textContent = f.name + ' (' + Math.round(FOTO.base64.length * 0.75 / 1024) + ' KB)';
      lerComIA();
    } else {
      SRC = await carregarImg(d); SRC.__nome = f.name; ROT = 0; RC = desenhar(SRC, 0); CROP = acharPapel(RC);
      show($('scanCtl'), true); show($('modeLbl'), true); mostrarResultado(true);
    }
  } catch (e) { flash($('sendMsg'), e.message, 'err'); }
}
async function lerComIA() {
  if (!FOTO) return;
  var meu = ++SEQ, a = $('aiMsg'); flash(a, 'Lendo a nota com IA...', 'ok');
  try {
    var r = await run('appLer', CODE, FOTO); if (meu !== SEQ) return;
    LEITURA = r;
    if (r.valor) $('valor').value = r.valor;
    if (r.data) $('data').value = r.data;
    if (r.estabelecimento) $('estab').value = r.estabelecimento;
    if (r.categoria && r.categoria !== 'A definir') $('cat').value = r.categoria;
    var txt = 'Lido: ' + (r.estabelecimento || 'estabelecimento não identificado') + (r.valor ? ' · ' + brl(r.valor) : '') + (r.cnpjConsumidor ? ' · consumidor ' + r.cnpjConsumidor : '');
    if (r.alertas && r.alertas.length) flash(a, txt + ' — Atenção: ' + r.alertas.join('; ') + '.', 'err'); else flash(a, txt + ' ✓', 'ok');
  } catch (e) {
    if (meu !== SEQ) return;
    flash(a, e.message.indexOf('nao configurada') >= 0 ? 'Leitura automática ainda não ativada. Preencha o valor.' : 'Não consegui ler a nota (' + e.message + '). Preencha o valor.', 'err');
  }
}
async function enviar() {
  if (EDIT && SRC) mostrarResultado();
  var v = parseFloat($('valor').value);
  if (!FOTO) return flash($('sendMsg'), 'Escolha ou tire a foto da nota.', 'err');
  if (!(v >= 0) || $('valor').value === '') return flash($('sendMsg'), 'Informe o valor da nota.', 'err');
  $('send').disabled = true; flash($('sendMsg'), 'Enviando...', 'ok');
  try {
    await run('appAdicionar', CODE, { dataDoc: $('data').value, centro: $('centro').value, categoria: $('cat').value, estabelecimento: $('estab').value, valor: v, obs: $('obs').value, foto: FOTO, previa: PREVIA ? { base64: PREVIA } : null, leitura: LEITURA });
    try { localStorage.setItem('cx_centro', $('centro').value); } catch (e) {}
    FOTO = null; SRC = null; RC = null; PREVIA = null; LEITURA = null; SEQ++; EDIT = false;
    show($('prev'), false); show($('cropWrap'), false); show($('scanCtl'), false); show($('modeLbl'), false); show($('aiMsg'), false); $('photoName').textContent = 'Nenhuma foto escolhida';
    $('valor').value = ''; $('estab').value = ''; $('obs').value = ''; $('cam').value = ''; $('file').value = ''; $('data').value = hoje();
    flash($('sendMsg'), 'Comprovante enviado.', 'ok'); atualizarFin();
  } catch (e) { flash($('sendMsg'), 'Não enviou: ' + e.message, 'err'); }

}
$('btnRot').onclick = girar;
$('btnCrop').onclick = function () { if (!SRC) return; if (EDIT) mostrarResultado(); else mostrarAjuste(); };
$('scanMode').onchange = function () { try { localStorage.setItem('cx_modo', this.value); } catch (e) {} if (SRC && !EDIT) mostrarResultado(); };
(function () { try { var m = localStorage.getItem('cx_modo'); if (m) $('scanMode').value = m; } catch (e) {} })();
$('cropWrap').addEventListener('pointerdown', iniciarArraste);
$('cropWrap').addEventListener('pointermove', moverArraste);
$('cropWrap').addEventListener('pointerup', fimArraste);
$('cropWrap').addEventListener('pointercancel', fimArraste);

var ESTADO = 'aberta';
var ETAPAS = ['Preenchendo', 'Enviado', 'Aprovado', 'Reembolso pago'];
function indiceEtapa(e) { return { aberta: 0, devolvida: 0, enviada: 1, aprovada: 2, paga: 3 }[e] || 0; }
function btn(txt, cls, fn) { var b = document.createElement('button'); b.textContent = txt; if (cls) b.className = cls; b.onclick = function () { fn(b); }; return b; }
function confirmar(b, txtOriginal, fn) {
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Toque de novo para confirmar'; setTimeout(function () { b.dataset.sure = ''; b.textContent = txtOriginal; }, 4000); return; }
  fn();
}
async function acao(nome, arg, okMsg) {
  var a = $('acaoMsg'); flash(a, 'Enviando...', 'ok');
  try { await run(nome, CODE, arg); flash(a, okMsg, 'ok'); await listar(true); }
  catch (e) { flash(a, e.message, 'err'); }
}
function renderEstado(s) {
  ESTADO = s.estado;
  var tl = $('tl'); tl.innerHTML = '';
  var idx = indiceEtapa(s.estado);
  ETAPAS.forEach(function (t, i) { var d = document.createElement('div'); d.textContent = t; if (i <= idx) d.className = 'on'; tl.appendChild(d); });
  var dm = $('devMsg');
  if (s.estado === 'devolvida') { dm.textContent = 'Devolvido pelo conferente: ' + s.obs; dm.hidden = false; } else dm.hidden = true;
  var box = $('acoes'); box.innerHTML = '';
  if (PAPEL === 'claudenir') {
    if ((s.estado === 'aberta' || s.estado === 'devolvida') && s.itens.length) {
      var e = btn('Finalizar semana e enviar ao conferente', 'primary', function (b) { confirmar(b, 'Finalizar semana e enviar ao conferente', function () { acao('appEnviar', null, 'Semana enviada ao conferente.'); }); });
      box.appendChild(e);
    } else if (s.estado === 'enviada') box.appendChild(document.createTextNode('Aguardando a conferência. Você não pode alterar os comprovantes até a decisão.'));

      box.appendChild(obs);
      var row = document.createElement('div'); row.className = 'row';
      row.appendChild(btn('Devolver', '', function (b) { confirmar(b, 'Devolver', function () { acao('appDevolver', obs.value, 'Caixa devolvido ao Claudenir.'); }); }));
      row.appendChild(btn('Aprovar o caixa', 'primary', function (b) { confirmar(b, 'Aprovar o caixa', function () { acao('appAprovar', null, 'Caixa aprovado.'); }); }));
      box.appendChild(row);
    } else if (s.estado === 'aprovada') {
      box.appendChild(btn('Marcar reembolso como pago', 'primary', function (b) { confirmar(b, 'Marcar reembolso como pago', function () { acao('appPagar', 'atual', 'Reembolso marcado como pago.'); }); }));
    } else if (s.estado === 'aberta' || s.estado === 'devolvida') box.appendChild(document.createTextNode('O Claudenir ainda não enviou a semana para conferência.'));
  }
}
function renderLista(itens) {
  var box = $('lista'), total = 0; box.innerHTML = '';
  if (!itens.length) box.textContent = 'Nenhum comprovante nesta semana.';
  itens.forEach(function (it) {
    total += Number(it.valor) || 0;
    var d = document.createElement('div'); d.className = 'item';
    var top = document.createElement('div'); top.className = 'top';
    var a = document.createElement('span'); a.textContent = it.estabelecimento || it.categoria;
    var b = document.createElement('span'); b.textContent = brl(it.valor); top.appendChild(a); top.appendChild(b);
    var m = document.createElement('div'); m.className = 'meta';
    m.textContent = it.dataDoc.split('-').reverse().join('/') + ' · Centro ' + it.centro + ' · ' + it.categoria + (it.obs ? ' · ' + it.obs : '') + (it.alertas ? ' · ⚠ ' + it.alertas : '');
    var ac = document.createElement('div'); ac.className = 'acts';
    var v = document.createElement('button'); v.textContent = 'Ver foto'; v.onclick = function () { verFoto(it.id, v); }; ac.appendChild(v);
    if (PAPEL === 'claudenir' && (ESTADO === 'aberta' || ESTADO === 'devolvida')) { var x = document.createElement('button'); x.textContent = 'Excluir'; x.onclick = function () { excluir(it.id, x); }; ac.appendChild(x); }
    d.appendChild(top); d.appendChild(m); d.appendChild(ac); box.appendChild(d);
  });
  $('total').textContent = brl(total);
}
function renderAnteriores(cx) {
  var box = $('anteriores'); box.innerHTML = '';
  $('antCard').hidden = !cx.length;
  cx.forEach(function (c) {
    var d = document.createElement('div'); d.className = 'ant';
    var t = document.createElement('div'); t.className = 't';
    var n = document.createElement('b'); n.textContent = c.nome + ' · ' + brl(c.total);
    var s = document.createElement('small'); s.textContent = c.atualizadoEm; t.appendChild(n); t.appendChild(s); d.appendChild(t);
    var rotulo = { paga: ['Reembolso pago', 'ok'], aprovada: ['Aprovado, a pagar', 'red'], enviada: ['Aguardando aprovação', 'red'], devolvida: ['Devolvido', 'red'] }[c.estado] || [c.estado, ''];
    if (c.estado === 'aprovada' && PAPEL === 'conferente') d.appendChild(btn('Marcar pago', 'primary', function (b) { confirmar(b, 'Marcar pago', function () { acao('appPagar', c.id, 'Reembolso marcado como pago.'); }); }));
    else { var p = document.createElement('span'); p.className = 'pill ' + rotulo[1]; p.textContent = rotulo[0]; d.appendChild(p); }
    box.appendChild(d);
  });
}
async function listar(manterMsg) {
  var box = $('lista'); if (!manterMsg) { box.textContent = 'Carregando...'; show($('acaoMsg'), false); }
  try {
    var s = await run('appSemana', CODE), cx = await run('appCaixas', CODE);
    renderEstado(s); renderLista(s.itens); renderAnteriores(cx);
  } catch (e) { box.textContent = 'Erro: ' + e.message; }
}

async function atualizarFin() {
  if (PAPEL !== 'claudenir') return;
  try {
    var s = await run('appSemana', CODE);
    FIN_OK = (s.estado === 'aberta' || s.estado === 'devolvida') && s.itens.length > 0;
    $('finTxt').textContent = s.itens.length + (s.itens.length === 1 ? ' comprovante' : ' comprovantes') + ' nesta semana · ' + brl(s.total);
  } catch (e) { FIN_OK = false; }
  show($('fin'), FIN_OK && !$('novo').hidden);
}
$('finBtn').onclick = function () {
  var b = this;
  confirmar(b, 'Finalizar semana e enviar ao conferente', async function () {
    flash($('finMsg'), 'Enviando...', 'ok');
    try { await run('appEnviar', CODE, null); flash($('finMsg'), 'Semana finalizada e enviada ao conferente.', 'ok'); FIN_OK = false; setTimeout(function () { aba('semana'); }, 900); }
    catch (e) { flash($('finMsg'), e.message, 'err'); }
  });
};
async function verFoto(id, btn) {
  btn.disabled = true;
  try { var d = await run('appFoto', CODE, id); if (d.indexOf('data:image') !== 0) { alert('Esta nota não tem prévia para exibir.'); } else { $('modalImg').src = d; show($('modal'), true); } }
  catch (e) { alert('Não abriu a foto: ' + e.message); }
  btn.disabled = false;
}
async function excluir(id, btn) {
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'Confirmar exclusão'; setTimeout(function () { btn.dataset.sure = ''; btn.textContent = 'Excluir'; }, 4000); return; }
  btn.disabled = true;
  try { await run('appExcluir', CODE, id); listar(); } catch (e) { alert('Não excluiu: ' + e.message); btn.disabled = false; }
}

function sair() {
  try { localStorage.removeItem('cx_code'); } catch (e) {}
  CODE = ''; PAPEL = ''; DADOS = null; FOTO = null;
  $('code').value = ''; $('loginErr').hidden = true; $('who').textContent = '';
  show($('logout'), false); show($('app'), false); show($('login'), true);
}
$('logout').onclick = sair;
$('enter').onclick = function () { var c = $('code').value.trim(); if (c) entrar(c); };
$('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
$('btnCam').onclick = function () { $('cam').click(); }; $('btnFile').onclick = function () { $('file').click(); };
$('cam').onchange = function () { escolheu(this.files[0]); }; $('file').onchange = function () { escolheu(this.files[0]); };
$('send').onclick = enviar; $('refresh').onclick = function () { listar(); };
$('modalClose').onclick = function () { show($('modal'), false); };
(function () { var c = ''; try { c = localStorage.getItem('cx_code') || ''; } catch (e) {} if (c) entrar(c); else show($('login'), true); })();
</script>
</body>
</html>
